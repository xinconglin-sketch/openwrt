name: N1 OpenWrt 23.05 (Full)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
        python3-distutils rsync unzip zlib1g-dev file wget

    - name: Update Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate Config
      run: |
        cat <<EOF > .config
        CONFIG_TARGET_armsr=y
        CONFIG_TARGET_armsr_armv8=y
        CONFIG_TARGET_armsr_armv8_DEVICE_generic=y

        CONFIG_TARGET_ROOTFS_EXT4FS=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_IMAGE_SDIMG=y
        CONFIG_TARGET_IMAGES_GZIP=y

        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl-openssl=y

        CONFIG_PACKAGE_v2raya=y
        CONFIG_PACKAGE_luci-app-v2raya=y

        CONFIG_PACKAGE_kmod-nft-tproxy=y
        CONFIG_PACKAGE_kmod-nf-tproxy=y
        CONFIG_PACKAGE_kmod-nft-socket=y

        EOF

        make defconfig

    - name: Custom Network
      run: |
        mkdir -p files/etc/config

        cat <<EOF > files/etc/config/network
        config interface 'loopback'
                option device 'lo'
                option proto 'static'
                option ipaddr '127.0.0.1'
                option netmask '255.0.0.0'

        config globals 'globals'
                option ula_prefix 'fd00:1::/48'

        config device
                option name 'br-lan'
                option type 'bridge'
                list ports 'eth0'

        config interface 'lan'
                option device 'br-lan'
                option proto 'static'
                option ipaddr '192.168.1.4'
                option netmask '255.255.255.0'
                option gateway '192.168.1.1'
                list dns '192.168.1.1'
        EOF

        cat <<EOF > files/etc/config/dhcp
        config dhcp 'lan'
                option interface 'lan'
                option ignore '1'
        EOF

    - name: Download Packages
      run: make download -j8

    - name: Build
      run: make -j$(nproc)

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-n1-23.05
        path: bin/targets/
