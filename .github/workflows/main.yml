name: Build OpenWrt 23.05 (armsr)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev \
        libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure target
      run: |
        echo "CONFIG_TARGET_armsr=y" >> .config
        echo "CONFIG_TARGET_armsr_armv8=y" >> .config
        echo "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y" >> .config
        make defconfig

    - name: Download packages
      run: make download -j8

    - name: Build
      run: make -j$(nproc)

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-armsr-armv8
        path: bin/targets/
